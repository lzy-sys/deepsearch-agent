# ============================================================
# 深度研搜评测任务集
# 每个任务包含：id、category、query（喂给主智能体的问题）、
# reference_points（参考答案要点，LLM-as-judge 据此打分）。
# requires 为可选字段：
#   - upload  ：需要先准备上传附件（用 run_evals.py --fixtures-dir 指定）
# ============================================================

- id: 1
  category: network
  query: 请检索 2026 年跨境电商 AI 客服应用的主要趋势，列出至少 5 条关键变化，并附上来源链接。
  reference_points:
    - 提到跨境电商与 AI 客服的结合场景
    - 至少列出 3 条以上具体趋势或变化
    - 给出信息来源（链接、机构或报告名称）
    - 回答结构清晰、有可执行结论

- id: 2
  category: network
  query: 请检索 2026 年中国法定节假日放假安排，说明各节假日的放假天数与调休安排。
  reference_points:
    - 列出主要法定节假日（春节、国庆等）
    - 说明放假天数与调休日期
    - 信息来自公开可靠来源
    - 对关键日期给出明确结论

- id: 3
  category: network
  query: 请检索 2026 年机器人行业的发展现状与主要厂商，整理一份简要的行业概览。
  reference_points:
    - 提到机器人行业整体规模或增速
    - 列出至少 2 家主要厂商及其方向
    - 提到人形机器人或工业机器人等细分领域
    - 附上信息出处

- id: 4
  category: database
  query: 请使用数据库查询工具，查询库存大于 100 的药品，按库存量升序列出药品名称、批次号、仓库位置和过期日期。
  reference_points:
    - 正确使用数据库工具（列出表/预览/执行 SQL）
    - 库存条件 > 100 被正确应用
    - 结果包含药品名称、批次号、仓库位置、过期日期字段
    - 按库存量升序排列

- id: 5
  category: database
  query: 请使用数据库查询工具，分析心血管类药品的库存情况，输出库存总量、偏低品种与建议。
  reference_points:
    - 识别出心血管类药品（如通过药品类别字段）
    - 给出库存总量或明细
    - 指出库存偏低的品种并给出补货/优化建议
    - 结果基于真实查询而非编造

- id: 6
  category: database
  query: 请使用数据库查询工具，找出销量最高的 5 种药品，并说明其销售趋势或特征。
  reference_points:
    - 正确关联药品表与销售记录表
    - 给出销量 Top5 药品名称与数值
    - 对结果做简要分析（趋势/占比/特征）
    - 数据来自数据库真实查询

- id: 7
  category: files
  requires: upload
  query: 请读取本次上传的文件，提炼核心观点、风险点和待补充信息，并给出下一步分析计划。
  reference_points:
    - 调用了文件读取工具（read_file_content）
    - 提炼出文件的核心观点
    - 指出风险点或待补充信息
    - 给出可执行的下一步计划

- id: 8
  category: mixed
  query: 结合数据库中的药品库存数据和网络公开的医药行业动态，输出一份库存优化建议，并生成 Markdown 报告。
  reference_points:
    - 同时使用数据库助手与网络搜索助手
    - 结论同时引用库存数据与行业信息
    - 生成 Markdown 文件到工作目录
    - 报告结构完整（背景、分析、建议）

- id: 9
  category: mixed
  query: 结合数据库中的销售数据与网络公开的行业趋势，整理一份企业销售数据分析报告，并生成 PDF。
  reference_points:
    - 使用数据库查询销售数据
    - 结合网络行业趋势信息
    - 先生成 Markdown 再转换为 PDF
    - 报告包含数据结论与业务建议

- id: 10
  category: mixed
  query: 请查询数据库中的药品与库存信息，结合网络检索到的医药行业政策动态，输出企业应对建议。
  reference_points:
    - 正确查询药品/库存数据
    - 检索到相关行业政策或动态
    - 建议能结合数据与政策两方面
    - 回答结构清晰、结论明确

- id: 11
  category: rag
  query: 请查询内部知识库中关于电商品类策略的白皮书内容，并整理成三条可执行建议。
  reference_points:
    - 调用知识库助手查询内部文档
    - 回答基于知识库检索内容而非编造
    - 给出至少三条具体可执行建议
    - 明确说明信息来源为内部知识库

- id: 12
  category: network
  query: 请检索 2026 年人工智能领域的投资趋势与主要赛道，整理一份要点清单。
  reference_points:
    - 提到 AI 投资整体规模或热度
    - 列出至少 3 个主要赛道（如大模型、Agent、算力等）
    - 提到代表厂商或机构
    - 附上信息出处
